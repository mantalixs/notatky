<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Редагування нотатки — Notatky</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body data-page="edit">
    <header class="navbar">
      <div class="navbar-left">
        <div class="nav-logo"></div>
        <div class="nav-title">Notatky</div>
      </div>
      <div class="navbar-links">
        <a class="nav-link" href="/">Головна</a>
        <a class="nav-link" href="/notes.html">Мої нотатки</a>
        <a class="nav-link" href="/create.html">Створити</a>
        <a class="nav-link" href="/profile.html">Профіль</a>

        <a id="login-link" class="nav-link" href="/login.html">Увійти</a>
        <button id="logout-btn" class="btn btn-secondary" style="display: none">
          Вийти
        </button>
      </div>
    </header>

    <main class="page-container">
      <section class="card">
        <div class="card-header">
          <h1 class="card-title">Редагування нотатки</h1>
          <p class="card-subtitle">
            Онови заголовок, текст або теги — зміни збережуться в базі.
          </p>
        </div>

        <div style="margin-bottom: 0.9rem">
          <label for="title">Заголовок</label>
          <input
            id="title"
            class="input"
            type="text"
            placeholder="Назва нотатки"
          />
        </div>

        <div style="margin-bottom: 0.9rem">
          <label for="text">Текст</label>
          <textarea
            id="text"
            class="textarea"
            placeholder="Зміни текст нотатки..."
          ></textarea>
        </div>

        <div style="margin-bottom: 0.9rem">
          <label for="tags">Теги (через кому)</label>
          <input
            id="tags"
            class="input"
            type="text"
            placeholder="робота, навчання, ідеї"
          />
        </div>

        <div id="message" class="message"></div>

        <div
          style="
            margin-top: 1.1rem;
            display: flex;
            justify-content: space-between;
            gap: 0.6rem;
            flex-wrap: wrap;
          "
        >
          <a href="/notes.html" class="btn btn-secondary">До списку</a>
          <div style="display: flex; gap: 0.6rem; flex-wrap: wrap">
            <button class="btn" onclick="saveNote()">Зберегти зміни</button>
            <button class="btn btn-secondary" onclick="back()">Назад</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/sync.js"></script>
    <script>
      const id = new URLSearchParams(location.search).get("id");

      const titleInput = document.getElementById("title");
      const textInput = document.getElementById("text");
      const tagsInput = document.getElementById("tags");
      const messageEl = document.getElementById("message");

      async function loadNote() {
        const token = localStorage.getItem("token");
        if (!token) {
          alert("Увійдіть у систему");
          location.href = "/login.html";
          return;
        }

        const res = await fetch("/notes/" + id, {
          headers: { Authorization: "Bearer " + token },
        });

        const note = await res.json();

        titleInput.value = note.title;
        textInput.value = note.text;
        tagsInput.value = (note.tags || []).join(", ");
      }

      async function saveNote() {
        const token = localStorage.getItem("token");
        if (!token) {
          alert("Увійдіть у систему");
          location.href = "/login.html";
          return;
        }

        const title = titleInput.value.trim();
        const text = textInput.value.trim();
        const tagsRaw = tagsInput.value;

        if (!title || !text) {
          messageEl.textContent = "Заповніть заголовок і текст";
          messageEl.className = "message message-error";
          return;
        }

        const res = await fetch("/notes/" + id, {
          method: "PATCH", // було PUT — ставимо PATCH
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({
            title,
            text,
            tags: tagsRaw
              ? tagsRaw
                  .split(",")
                  .map((s) => s.trim())
                  .filter(Boolean)
              : [],
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          alert(data.message || "Помилка збереження");
          return;
        }

        alert("Збережено!");
        location.href = "/view.html?id=" + id;
      }

      function back() {
        history.back();
      }

      loadNote();
    </script>
  </body>
</html>
