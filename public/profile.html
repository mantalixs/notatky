<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Профіль — Notatky</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      .profile-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: 1.4rem;
        align-items: flex-start;
        margin-top: 1.4rem;
      }

      .profile-card {
        border-radius: 18px;
        padding: 1.4rem 1.6rem;
        background: #ffffff;
        border: 1px solid #f3dbe9;
        box-shadow: 0 18px 45px rgba(212, 140, 167, 0.18);
      }

      .profile-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 0.8rem;
      }

      .profile-avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 3px solid #ffd1e8;
        box-shadow: 0 10px 24px rgba(212, 140, 167, 0.25);
      }

      .profile-name {
        font-weight: 600;
        font-size: 1.1rem;
        margin-bottom: 0.1rem;
      }

      .profile-email {
        font-size: 0.9rem;
        color: #9f8ba8;
      }

      .profile-stats-row {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
        margin-top: 0.8rem;
      }

      .stat-pill {
        flex: 0 0 auto;
        min-width: 120px;
        padding: 0.6rem 0.8rem;
        border-radius: 16px;
        background: #fff6fb;
        border: 1px solid #f4cade;
      }

      .stat-pill-title {
        font-size: 0.8rem;
        color: #9f8ba8;
        margin-bottom: 0.15rem;
      }

      .stat-pill-value {
        font-size: 1.1rem;
        font-weight: 600;
      }

      .stat-pill.done .stat-pill-value {
        color: #2e7d32;
      }

      .stat-pill.pending .stat-pill-value {
        color: #c83c84;
      }

      .profile-hint {
        margin-top: 0.8rem;
        font-size: 0.85rem;
        color: #9f8ba8;
      }

      .chart-card {
        border-radius: 18px;
        padding: 1.4rem 1.6rem;
        background: #ffffff;
        border: 1px solid #f3dbe9;
        box-shadow: 0 18px 45px rgba(212, 140, 167, 0.18);
      }

      .chart-title {
        margin: 0 0 0.5rem;
        font-size: 1.05rem;
      }

      .chart-subtitle {
        margin: 0;
        font-size: 0.86rem;
        color: #9f8ba8;
      }

      @media (max-width: 820px) {
        .profile-layout {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body data-page="profile">
    <header class="navbar">
      <div class="navbar-left">
        <div class="nav-logo"></div>
        <div class="nav-title">Notatky</div>
      </div>
      <div class="navbar-links">
        <a class="nav-link" href="/">Головна</a>
        <a class="nav-link" href="/notes.html">Мої нотатки</a>
        <a class="nav-link" href="/create.html">Створити</a>
        <a class="nav-link active" href="/profile.html">Профіль</a>

        <span class="nav-status">Online</span>
        <a id="login-link" class="nav-link" href="/login.html">Увійти</a>
        <button id="logout-btn" class="btn btn-secondary" style="display: none">
          Вийти
        </button>
      </div>
    </header>

    <main class="page-container">
      <section class="profile-layout">
        <div class="profile-card">
          <div class="profile-header">
            <div id="avatar" class="profile-avatar"></div>
            <div>
              <div class="profile-name">Мій профіль</div>
              <div id="email" class="profile-email"></div>
            </div>
          </div>

          <div class="profile-stats-row">
            <div class="stat-pill done">
              <div class="stat-pill-title">Завершені нотатки</div>
              <div id="done-count" class="stat-pill-value">–</div>
            </div>
            <div class="stat-pill pending">
              <div class="stat-pill-title">В процесі</div>
              <div id="pending-count" class="stat-pill-value">–</div>
            </div>
          </div>

          <div class="profile-hint">
            Статуси нотаток можна змінювати на сторінках “Мої нотатки” та
            “Перегляд нотатки”.
          </div>
        </div>

        <div class="chart-card">
          <h2 class="chart-title">Статистика нотаток</h2>
          <p class="chart-subtitle">
            Порівняння завершених і тих, що ще в роботі.
          </p>
          <canvas id="chart" style="margin-top: 1rem"></canvas>
        </div>
      </section>
    </main>

    <script src="/sync.js"></script>
    <script>
      if (!localStorage.getItem("token")) {
        alert("Спочатку увійди в акаунт");
        location.href = "/login.html";
      }

      function randomAvatar() {
        const seed = localStorage.getItem("email") || "user";
        return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(seed)}`;
      }

      async function loadStats() {
        const token = localStorage.getItem("token");

        const res = await fetch("/notes/stats/info", {
          headers: { Authorization: "Bearer " + token },
        });

        if (!res.ok) {
          console.error("Помилка завантаження статистики", res.status);
          return;
        }

        const { done, pending } = await res.json();

        document.getElementById("done-count").innerText = done;
        document.getElementById("pending-count").innerText = pending;

        const ctx = document.getElementById("chart");

        new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: ["Завершені", "В процесі"],
            datasets: [
              {
                data: [done, pending],
                backgroundColor: ["#51cf66", "#ff9ecb"],
                borderWidth: 0,
              },
            ],
          },
          options: {
            plugins: {
              legend: {
                labels: {
                  color: "#4b3a55",
                  font: { size: 12 },
                },
              },
            },
          },
        });
      }

      document.getElementById("email").innerText =
        localStorage.getItem("email") || "";
      document.getElementById("avatar").style.backgroundImage =
        `url('${randomAvatar()}')`;

      loadStats();
    </script>
  </body>
</html>
